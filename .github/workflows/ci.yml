name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, build, static bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build SPA
        run: npm run build

      - name: Build standalone (GitHub Pages) version
        run: npm run build:static

      - name: Smoke test API
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: podrabotka-msk-static
          path: docs
          retention-days: 14
