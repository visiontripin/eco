name: Deploy demo

# Публикует автономную сборку (docs/) на GitHub Pages.
#
# Требование: в репозитории один раз включён GitHub Pages
#   Settings → Pages → Source: "GitHub Actions"
# (или "Deploy from a branch" → main → /docs — тогда деплой идёт без workflow).
#
# Если Pages ещё не включён, workflow не падает: сборка проходит, а в логах
# остаётся предупреждение — CI остаётся зелёным.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build standalone bundle
        run: npm run build:static

      - name: Detect Pages site
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages is disabled — manual step required
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages не включён. Включите один раз: Settings → Pages → Source: 'GitHub Actions' (или 'Deploy from a branch' → main → /docs). Сборка при этом уже готова в docs/."
          echo "### GitHub Pages не включён" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Статическая сборка готова в \`docs/\`, но публикация не выполнена." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Включите один раз: **Settings → Pages → Source: GitHub Actions** (или **Deploy from a branch → main → /docs**)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
